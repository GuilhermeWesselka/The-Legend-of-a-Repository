<script>
 

  function cadastrar() {
     aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value.toLowerCase().trim(); // garantir que o email sempre seja com minusculas e sem espaços vazios
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var listaSenha= [senha_input.value];
    var caractereEspecial = "!@#$%*()_+=-',.;:~[{}]´`?/><|"
    var temCaractereEspecial = false;

    //JSON para guardar e validar os dados do usuário
    let usuarioDados = {
    nome: nomeVar,
    email: emailVar
  };
    
    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "") {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      //encerra o loading e para o cadastro
      finalizarAguardar();
      return false;
    }

    // validações de senhas iguais
    else if(senhaVar != confirmacaoSenhaVar){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(As senhas não são iguais!)"
      finalizarAguardar();
      return false;
    }

    // validações para cadastrar o email e senha e forma correta
    else{


      // validações se o email tem '@' e '.'
      let stringEmail = usuarioDados.email;
      let arroba = -1;
      let ponto = -1;

    for(let i = 0; i < usuarioDados.email.length; i++){
      if(stringEmail[i] == "@"){
        arroba = i;
      }

      if(stringEmail[i] == "." && arroba !== -1){
        ponto = i;
      }

    }

      if(arroba == -1){
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(O email deve conter '@' !)"
        finalizarAguardar();
        return false;
        }

      if(ponto == -1){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(O email deve conter '.' !)"
      finalizarAguardar();
      return false;
      }

     //validações de senhas com caractere especial
    for (let i = 0; i < senhaVar.length; i++) {
      var letraAtual = senhaVar[i];

      if(caractereEspecial.includes(letraAtual) && senhaVar == confirmacaoSenhaVar){
        temCaractereEspecial = true
      }
    }

    if(temCaractereEspecial == false){
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(A senha deve ter pelo menos um caractere especial!)"
      finalizarAguardar();
      return false;
    }
    else{
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(Senha válida, continuando cadastro...)"
      setInterval(sumirMensagem, 5000);
    }
  }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
       // idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }
