<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradTwili" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f14" />
      <stop offset="100%" stop-color="#121a24" />
    </linearGradient>
    
    <!-- Twili Cyan/Blue Glow Gradient -->
    <linearGradient id="twiliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="40%" stop-color="#00bcff" />
      <stop offset="70%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Twili Glow Filter -->
    <filter id="twiliGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main Dark Background -->
  <rect x="10" y="10" width="780" height="380" rx="0" fill="url(#bgGradTwili)" stroke="url(#twiliGrad)" stroke-width="2" filter="url(#twiliGlow)" />

  <!-- Twili Circuit-like Geometric Corner Patterns (8-bit / Rune style) -->
  <!-- Top Left -->
  <path d="M 10 40 L 40 40 L 40 10" fill="none" stroke="url(#twiliGrad)" stroke-width="3" />
  <rect x="15" y="15" width="12" height="12" fill="url(#twiliGrad)" />
  <rect x="48" y="12" width="6" height="6" fill="url(#twiliGrad)" />
  <rect x="12" y="48" width="6" height="6" fill="url(#twiliGrad)" />

  <!-- Top Right -->
  <path d="M 790 40 L 760 40 L 760 10" fill="none" stroke="url(#twiliGrad)" stroke-width="3" />
  <rect x="773" y="15" width="12" height="12" fill="url(#twiliGrad)" />
  <rect x="746" y="12" width="6" height="6" fill="url(#twiliGrad)" />
  <rect x="782" y="48" width="6" height="6" fill="url(#twiliGrad)" />

  <!-- Bottom Left -->
  <path d="M 10 360 L 40 360 L 40 390" fill="none" stroke="url(#twiliGrad)" stroke-width="3" />
  <rect x="15" y="373" width="12" height="12" fill="url(#twiliGrad)" />
  <rect x="48" y="382" width="6" height="6" fill="url(#twiliGrad)" />
  <rect x="12" y="346" width="6" height="6" fill="url(#twiliGrad)" />

  <!-- Bottom Right -->
  <path d="M 790 360 L 760 360 L 760 390" fill="none" stroke="url(#twiliGrad)" stroke-width="3" />
  <rect x="773" y="373" width="12" height="12" fill="url(#twiliGrad)" />
  <rect x="746" y="382" width="6" height="6" fill="url(#twiliGrad)" />
  <rect x="782" y="346" width="6" height="6" fill="url(#twiliGrad)" />

  <!-- Twili Central Runes / Segmented Lines -->
  <!-- Top Center -->
  <rect x="380" y="8" width="40" height="6" fill="url(#twiliGrad)" />
  <path d="M 330 14 L 370 14 M 430 14 L 470 14" fill="none" stroke="url(#twiliGrad)" stroke-width="1.5" />

  <!-- Bottom Center -->
  <rect x="380" y="386" width="40" height="6" fill="url(#twiliGrad)" />
  <path d="M 330 386 L 370 386 M 430 386 L 470 386" fill="none" stroke="url(#twiliGrad)" stroke-width="1.5" />

  <!-- Inner Tech Line -->
  <rect x="25" y="25" width="750" height="350" rx="0" fill="none" stroke="url(#twiliGrad)" stroke-width="0.75" stroke-dasharray="15,10" opacity="0.7" />
</svg>
