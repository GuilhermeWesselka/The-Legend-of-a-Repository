<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente Dourado Suave e Perolado idêntico à referência -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2da93" />
      <stop offset="25%" stop-color="#f7e7b4" />
      <stop offset="50%" stop-color="#fff4cc" />
      <stop offset="75%" stop-color="#f7e7b4" />
      <stop offset="100%" stop-color="#f2da93" />
    </linearGradient>
  </defs>

  <!-- Grupo Geral com o Gradiente Aplicado -->
  <g fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ================= CENTRO HEXAGONAL ================= -->
    <!-- Hexágono Central Alongado -->
    <polygon points="360,60 375,40 425,40 440,60 425,80 375,80" stroke-width="4" />
    <!-- Linha Interna do Hexágono -->
    <polygon points="368,60 380,46 420,46 432,60 420,74 380,74" stroke-width="2" />
    
    <!-- Detalhes de dentes/travas superiores (Estilo Engrenagem) -->
    <line x1="385" y1="40" x2="385" y2="34" />
    <line x1="395" y1="40" x2="395" y2="34" />
    <line x1="405" y1="40" x2="405" y2="34" />
    <line x1="415" y1="40" x2="415" y2="34" />
    
    <!-- Detalhes de dentes/travas inferiores -->
    <line x1="385" y1="80" x2="385" y2="86" />
    <line x1="395" y1="80" x2="395" y2="86" />
    <line x1="405" y1="80" x2="405" y2="86" />
    <line x1="415" y1="80" x2="415" y2="86" />

    <!-- ================= LADO ESQUERDO ================= -->
    <!-- Setas Angulares / Chevron à esquerda do centro -->
    <polyline points="350,48 335,60 350,72" />
    <polyline points="342,48 327,60 342,72" />
    
    <!-- Módulo de Quadrados Concêntricos Esquerdo -->
    <rect x="290" y="45" width="30" height="30" />
    <rect x="297" y="52" width="16" height="16" stroke-width="2" />
    
    <!-- Extensões e Linhas Horizontais Conectoras -->
    <line x1="327" y1="60" x2="320" y2="60" />
    <line x1="290" y1="60" x2="278" y2="60" />
    
    <!-- Bloco Geométrico Vazado Esquerdo Médio -->
    <polyline points="278,48 262,48 262,72 278,72" />
    <line x1="262" y1="60" x2="242" y2="60" />
    
    <!-- Segundo Módulo de Quadrado Esquerdo -->
    <rect x="218" y="48" width="24" height="24" />
    <rect x="224" y="54" width="12" height="12" stroke-width="1.5" />
    <line x1="218" y1="60" x2="200" y2="60" />
    
    <!-- Detalhe de Barras Paralelas de Extremidade Esquerda -->
    <line x1="200" y1="52" x2="175" y2="52" />
    <line x1="200" y1="68" x2="175" y2="68" />
    
    <!-- Linha Final de Extensão Esquerda com Ponta Fina -->
    <line x1="185" y1="60" x2="50" y2="60" stroke-width="4" />
    <line x1="140" y1="55" x2="110" y2="55" stroke-width="2" />
    <line x1="140" y1="65" x2="110" y2="65" stroke-width="2" />

    <!-- ================= LADO DIREITO ================= -->
    <!-- Setas Angulares / Chevron à direita do centro -->
    <polyline points="450,48 465,60 450,72" />
    <polyline points="458,48 473,60 458,72" />
    
    <!-- Módulo de Quadrados Concêntricos Direito -->
    <rect x="480" y="45" width="30" height="30" />
    <rect x="487" y="52" width="16" height="16" stroke-width="2" />
    
    <!-- Extensões e Linhas Horizontais Conectoras -->
    <line x1="473" y1="60" x2="480" y2="60" />
    <line x1="510" y1="60" x2="522" y2="60" />
    
    <!-- Bloco Geométrico Vazado Direito Médio -->
    <polyline points="522,48 538,48 538,72 522,72" />
    <line x1="538" y1="60" x2="558" y2="60" />
    
    <!-- Segundo Módulo de Quadrado Direito -->
    <rect x="558" y="48" width="24" height="24" />
    <rect x="564" y="54" width="12" height="12" stroke-width="1.5" />
    <line x1="582" y1="60" x2="600" y2="60" />
    
    <!-- Detalhe de Barras Paralelas de Extremidade Direita -->
    <line x1="600" y1="52" x2="625" y2="52" />
    <line x1="600" y1="68" x2="625" y2="68" />
    
    <!-- Linha Final de Extensão Direita com Ponta Fina -->
    <line x1="615" y1="60" x2="750" y2="60" stroke-width="4" />
    <line x1="660" y1="55" x2="690" y2="55" stroke-width="2" />
    <line x1="660" y1="65" x2="690" y2="65" stroke-width="2" />

  </g>
</svg>