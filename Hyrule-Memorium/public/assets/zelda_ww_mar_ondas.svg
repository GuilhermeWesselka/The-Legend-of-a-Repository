<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020b14"/>
      <stop offset="100%" stop-color="#09203a"/>
    </linearGradient>
    
    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a9bb0"/>
      <stop offset="50%" stop-color="#5ec2d7"/>
      <stop offset="100%" stop-color="#3a9bb0"/>
    </linearGradient>
  </defs>

  <!-- Main Card Background -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)" stroke="#013146" stroke-width="4"/>

  <!-- Inner Dashed Border -->
  <rect x="25" y="25" width="750" height="450" rx="15" fill="none" stroke="#164d63" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Top Wave Pattern (Smooth Cel-Shaded Waves) -->
  <path d="M 40,45 Q 65,25 90,45 T 140,45 T 190,45 T 240,45 T 290,45 T 340,45 T 390,45 T 440,45 T 490,45 T 540,45 T 590,45 T 640,45 T 690,45 T 740,45 T 760,45" 
        fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Bottom Wave Pattern -->
  <path d="M 40,455 Q 65,435 90,455 T 140,455 T 190,455 T 240,455 T 290,455 T 340,455 T 390,455 T 440,455 T 490,455 T 540,455 T 590,455 T 640,455 T 690,455 T 740,455 T 760,455" 
        fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Toon Fish Details (Corners) -->
  <!-- Top Left Fish -->
  <path d="M 55,75 C 65,70 80,75 90,75 L 95,70 L 95,80 L 90,75 C 80,75 65,80 55,75 Z" fill="#80b8bd" opacity="0.8"/>
  <circle cx="62" cy="74" r="1" fill="#020b14"/>

  <!-- Bottom Left Fish -->
  <path d="M 55,425 C 65,420 80,425 90,425 L 95,420 L 95,430 L 90,425 C 80,425 65,430 55,425 Z" fill="#80b8bd" opacity="0.8"/>
  <circle cx="62" cy="424" r="1" fill="#020b14"/>

  <!-- Top Right Fish -->
  <path d="M 745,75 C 735,70 720,75 710,75 L 705,70 L 705,80 L 710,75 C 720,75 735,80 745,75 Z" fill="#80b8bd" opacity="0.8"/>
  <circle cx="738" cy="74" r="1" fill="#020b14"/>

  <!-- Bottom Right Fish -->
  <path d="M 745,425 C 735,420 720,425 710,425 L 705,420 L 705,430 L 710,425 C 720,425 735,430 745,425 Z" fill="#80b8bd" opacity="0.8"/>
  <circle cx="738" cy="424" r="1" fill="#020b14"/>

  <!-- Seagulls (Side Decals) -->
  <!-- Left Seagull -->
  <path d="M 40,240 Q 50,230 60,240 Q 70,230 80,240" fill="none" stroke="#256275" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right Seagull -->
  <path d="M 720,240 Q 730,230 740,240 Q 750,230 760,240" fill="none" stroke="#256275" stroke-width="2" stroke-linecap="round"/>
</svg>
