<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyrule Memorium | Gráfico</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/style.css">
    <script src="../js/sessao.js"></script>
    <!-- REMOVIDOS: estilo.css (inexistente) e favicon2.ico (inexistente) -->

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://googleapis.com" rel="stylesheet">

    <!-- Biblioteca Chart.js para desenhar o gráfico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<!-- Valida o login e chama obterDadosGrafico() assim que a tela abre -->

<body onload="validarSessao(), obterDadosGrafico()" style="background-color: #161618;">

    <div class="janela">
        <!-- Menu lateral padronizado igual ao mural e ao questionário -->
        <div class="header-left">
            <h1>Hyrule Memorium</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./questionario.html">
                    <h3>Questionário</h3>
                </a>
            </div>

            <div class="btn-nav">
                <h3>Gráfico</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Mural</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>

        <!-- Área principal limpa: apenas o título e a caixa do gráfico -->
        <div class="dash">
            <h2 style="color: white; text-align: center; margin-top: 30px; font-size: 36px;">
                Jogos mais marcantes de Hyrule
            </h2>

            <div class="graph">
                <canvas id="grafico_jogos"></canvas>
            </div>
        </div>
    </div>

    <script>
        function obterDadosGrafico() {
            fetch("/questionarios/contagem")
            .then(function (resposta) {
                if (resposta.ok){
                    resposta.json().then(function (lista_contagem) {
                        plotarGrafico(lista_contagem);
                    });
                    
                }   
                else {
                    alert("Erro ao buscar os dados do gráfico " + resposta.status)
                }
            })
            .catch(function(erro) {
                console.error(erro);
                alert("Erro de conexão ao carregar o gráfico")
            });
            
        }
    </script>
</body>

</html>
