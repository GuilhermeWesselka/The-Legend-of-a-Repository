<!DOCTYPE html>
<!-- Base original: web-data-viz/public/dashboard/dashboard.html (gráfico AquaTech).
     Alterado para o gráfico de jogos do Hyrule-Memorium. Original em legacy/web-data-viz/. -->
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyrule Memorium | Gráfico</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/style.css">
    <link rel="stylesheet" href="./../css/hyryleDashboard.css">
    <script src="../js/sessao.js"></script>

    <!-- Biblioteca Chart.js para desenhar o gráfico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<!-- Valida o login e chama obterDadosGrafico() assim que a tela abre -->

<body class="main-dash" onload="validarSessao(), obterDadosGrafico(), obterDadosUsuarios()">

    <div class="janela">
        <!-- Menu lateral padronizado igual ao mural e ao questionário -->
        <div class="header-left">
            <h1>Hyrule Memorium</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./questionario.html">
                    <h3>Comunidade</h3>
                </a>
            </div>

            <div class="btn-nav">
                <h3>Gráfico</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Mural</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>

        <!--área principal da dash, compõe o gráfico e as KPIs-->
        <div class="dash">
            <h2 class="titulo-grafico">
                Jogos mais marcantes de Hyrule
            </h2>
            <div class="resumo-grafico" id="resumo_grafico">
                <div class="card-resumo">
                    <span class="card-rotulo">Jogo mais votado</span>
                    <div class="card-valor" id="jogo_mais_votado"></div>
                    <span class="card-ajuda" id="detalhe_mais_votado">Carregando...</span>
                </div>

                <div class="card-resumo">
                    <span class="card-rotulo">Menos lembrado</span>
                    <div class="card-valor" id="jogo_menos_lembrado"></div>
                    <span class="card-ajuda" id="detalhe_menos_lembrado">Carregando...</span>
                </div>

                <div class="card-resumo">
                    <span class="card-rotulo">Total de Memórias</span>
                    <div class="card-valor" id="total_memorias"></div>
                    <span class="card-ajuda">Respostas recebidas</span>
                </div>

                <div class="card-resumo">
                    <span class="card-rotulo">Jogos citados</span>
                    <div class="card-valor" id="jogos_citados"></div>
                    <span class="card-ajuda">Títulos diferentes</span>
                </div>
            </div>

            <div class="graficos">
                <div class="graph">
                    <canvas id="grafico_usuarios"></canvas>
                </div>

                <div class="grafico-rosca">
                    <canvas id="grafico_distribuicao"></canvas>
                </div>
            </div>

            <p id="grafico_vazio" style="display: none;">
                Nenhuma memória cadastrada ainda.
            </p>
        </div>
    </div>

    <script>

        
        function obterDadosGrafico() {
            fetch("/questionarios/contagem")
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (lista_contagem) {
                            preencherResumo(lista_contagem);
                            plotarGrafico(lista_contagem);
                        });
                    }
                    else {
                        alert("Erro ao buscar os dados do grafico... " + resposta.status);
                    }
                })
                .catch(function (erro) {
                    console.error(erro)
                    alert("Erro de conexão ao carregar o gráfico");
                });
        }

        function obterDadosUsuarios() {
            fetch("/questionarios/top-ativos")
            .then(function (resposta) {
                if (resposta.ok) {
                    return resposta.json().then(function (usuarios) {
                        plotarUsuarios(usuarios);
                    });
                }
                else {
                    alert("Erro ao buscar o ranking... " + resposta.status);
                }
            })
        }

        function plotarUsuarios(usuarios){
            var nomes = [];
            var quantidade = [];
            // looping para achar os usuários pelo vetor
            for(let i = 0; i < usuarios.length; i++){
                nomes.push(usuarios[i].nome);
                quantidade.push(Number(usuarios[i].quantidade));
            }
            new Chart(document.getElementById("grafico_usuarios"), {
        type: "bar",
        data: {
            labels: nomes,
            datasets: [{
                label: "Comentários",
                data: quantidade,
                backgroundColor: "#5ec2d7",
                borderColor: "#256275",
                borderWidth: 2,
                maxBarThickness: 80
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: "#e8f4f8"
                    },
                    grid: {
                        color: "#184a75"
                    }
                },
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1,
                        color: "#e8f4f8"
                    },
                    grid: {
                        color: "#184a75"
                    }
                }
            }
        }
    });
}
        // funções para os dados dos cards/KPIs da dash
        function formatarJogos(lista) {
            let txt = "";

            for (let i = 0; i < lista.length; i++) {
                if (i > 0) {
                    txt += " • ";
                }
                txt += lista[i].jogo;
            }
            return txt;

        } //calculo de porcentagem dos votos
        function calcularPct(quantidade, total) {
            let pct = (quantidade / total) * 100;
            return pct.toFixed(1).replace(".", ",") + "%"; // estiliza o número
        }

        function formatarMemorias(quantidade) {
            if (quantidade == 1) {
                return "1 memória";
            }

            return quantidade + " memórias";
        }

        function preencherResumo(lista_contagem) {
            let resumo = document.getElementById("resumo_grafico");
            let total = 0;

            if (lista_contagem.length == 0) {
                resumo.style.display = "none"; // se for zero não mostra nada
                return;
            }

            resumo.style.display = "flex";

            for (let i = 0; i < lista_contagem.length; i++) {
                total += Number(lista_contagem[i].quantidade);
            }

            let maiorQuantidade = Number(lista_contagem[0].quantidade);
            let menorQuantidade = Number(lista_contagem[0].quantidade);

            for (let i = 0; i < lista_contagem.length; i++) {
                let quantidade = Number(lista_contagem[i].quantidade);

                if (quantidade > maiorQuantidade) {
                    maiorQuantidade = quantidade;
                }

                if (quantidade < menorQuantidade) {
                    menorQuantidade = quantidade;
                }
            }

            // lista para guardar os mais e menos votados
            let maisVotados = [];
            let menosLembrados = [];

            for (let i = 0; i < lista_contagem.length; i++) {
                let quantidade = Number(lista_contagem[i].quantidade);

                if (quantidade == maiorQuantidade) {
                    maisVotados.push(lista_contagem[i]);
                }

                if (quantidade == menorQuantidade) {
                    menosLembrados.push(lista_contagem[i]);
                }
            }

            let nomeMaisVotado = "";
            let nomeMenosLembrado = "";

                
            if (maisVotados.length > 1) { // se tiver mais de um 'Mais votado', ele empata
                nomeMaisVotado = "Empate: " + formatarJogos(maisVotados);
            }
            else {
                nomeMaisVotado = maisVotados[0].jogo;
            }

            if (menosLembrados.length > 1) {
                nomeMenosLembrado = "Empate: " + formatarJogos(menosLembrados);
            }
            else {
                nomeMenosLembrado = menosLembrados[0].jogo;
            }

            // usado innerText para não conflitar com o banco de dados por causa de caracteres especiais
            document.getElementById("jogo_mais_votado").innerText = nomeMaisVotado;
            document.getElementById("jogo_menos_lembrado").innerText = nomeMenosLembrado;
            document.getElementById("total_memorias").innerText = total;
            document.getElementById("jogos_citados").innerText = lista_contagem.length;

            if (lista_contagem.length == 1) {
                document.getElementById("detalhe_mais_votado").innerText = "Único jogo citado até agora";
                document.getElementById("detalhe_menos_lembrado").innerText = "Único jogo citado até agora";
            }
            else {
                let detalheMais = formatarMemorias(maiorQuantidade);
                let detalheMenos = formatarMemorias(menorQuantidade);

                if (maisVotados.length > 1) {
                    detalheMais += " cada • " + calcularPct(maiorQuantidade, total) + " cada";
                }
                else {
                    detalheMais += " • " + calcularPct(maiorQuantidade, total) + " do total";
                }

                if (menosLembrados.length > 1) {
                    detalheMenos += " cada • " + calcularPct(menorQuantidade, total) + " cada";
                }
                else {
                    detalheMenos += " • " + calcularPct(menorQuantidade, total) + " do total";
                }

                document.getElementById("detalhe_mais_votado").innerText = detalheMais;
                document.getElementById("detalhe_menos_lembrado").innerText = detalheMenos;
            }
        }

        function plotarGrafico(lista_contagem) {
            var graficoVazio = document.getElementById("grafico_vazio");
            var areaGraficos = document.querySelector(".graficos");

            if (lista_contagem.length == 0) {
                areaGraficos.style.display = "none";
                graficoVazio.style.display = "block";
                return;
            }

            areaGraficos.style.display = "flex";
            graficoVazio.style.display = "none";

            var labels = [];
            var valores = [];

            for (var i = 0; i < lista_contagem.length; i++) {
                labels.push(lista_contagem[i].jogo);
                valores.push(Number(lista_contagem[i].quantidade));
            }

       

            // Cores da rosca | cores num vetor por recomendação para repetir as cores
            var cores = ["#2a6f97", "#3a8fb7", "#5ec2d7", "#f3d078", "#dfa82b", "#9ccc65"];
            var coresRosca = [];

            for (var i = 0; i < valores.length; i++) {
                coresRosca.push(cores[i % cores.length]);
            }

            // Gráfico de rosca com os mesmos dados
            new Chart(document.getElementById("grafico_distribuicao"), {
                type: "doughnut",
                data: {
                    labels: labels,
                    datasets: [{
                        data: valores,
                        backgroundColor: coresRosca,
                        borderColor: "#041220",
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    cutout: "60%",
                    plugins: {
                        legend: {
                            position: "bottom",
                            labels: {
                                color: "#e8f4f8",
                                boxWidth: 12,
                                font: {
                                    family: "Barlow",
                                    size: 11
                                }
                            }
                        }
                    }
                }
            });
        }
        


    </script>
</body>

</html>
