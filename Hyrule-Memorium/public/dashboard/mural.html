<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. TÍTULO ATUALIZADO -->
    <title>Hyrule Memorium | Mural</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <script src="../js/sessao.js"></script>
    <link rel="stylesheet" href="./../css/style.css">
</head>

<!-- Mantemos validarSessao() e atualizarFeed() ao carregar a página -->
<body class="tema-ww" onload="validarSessao(), atualizarFeed()">

    <div class="janela">

        <div class="header-left">
            <!-- 2. NOME E MENU LATERAL ATUALIZADOS -->
            <h1>Hyrule Memorium</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <!-- Link para a home da comunidade -->
            <div class="btn-nav-white">
                <a href="./questionario.html">
                    <h3>Comunidade</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Gráfico</h3>
                </a>
            </div>

            <div class="btn-nav">
                <h3>Mural</h3>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>

        <div class="dash-right">
            <!-- O backend e o banco mantêm o nome "questionario" porque vieram do web-data-viz.
                 No front, esta área é chamada de Mural, o nome visível para o usuário. -->
            <div class="avisos">
                <div class="container">
                    <h1>Conte sua memória de Hyrule</h1>

                    <!-- Formulário de memórias centralizado no mural, acessado pela home da comunidade -->
                    <div class="div-form">
                        <div id="div_formulario">
                            <label>
                                Qual jogo marcou você?
                                <br>
                                <select id="select_jogo" name="jogo">
                                    <option value="" selected disabled>Selecione um jogo</option>
                                    <option value="The Legend of Zelda: Ocarina of Time">The Legend of Zelda: Ocarina of Time</option>
                                    <option value="The Legend of Zelda: Majora's Mask">The Legend of Zelda: Majora's Mask</option>
                                    <option value="The Legend of Zelda: The Wind Waker">The Legend of Zelda: The Wind Waker</option>
                                    <option value="The Legend of Zelda: Twilight Princess">The Legend of Zelda: Twilight Princess</option>
                                </select>
                            </label>

                            <br><br>

                            <label>
                                Por que esse jogo é especial para você?
                                <br>
                                <textarea id="textarea_motivacao" name="motivacao"></textarea>
                            </label>

                            <br><br>

                            <label>
                                Qual jogo você recomenda? (opcional)
                                <br>
                                <input id="ipt_recomendacao" name="recomendacao" type="text">
                            </label>

                            <!-- Div de loading usada pelo aguardar() e finalizarAguardar() -->
                            <div id="div_aguardar" class="loading-div">
                                <span>Carregando...</span>
                            </div>

                            <br><br>

                            <!-- Botão chama a mesma função publicar() do questionario.js -->
                            <button id="btn_enviar" type="button" onclick="publicar()">Enviar memória</button>
                        </div>
                    </div>

                    <h1>Mural de memórias</h1>
                    <br><br>

                    <!-- 4. ÁREA DO FÓRUM E COMENTÁRIOS -->
                    <div class="div-results">
                        <!-- Onde os cards clonados vão aparecer -->
                        <div id="feed_container" class="feed-container"></div>

                        <!-- Mensagem caso o banco retorne vazio (status 204) -->
                        <p id="feed_vazio" style="display: none;">
                            Nenhuma memória publicada ainda.
                        </p>

                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 5. SCRIPTS EXTERNOS -->
    <script src="../js/questionario.js"></script>

    <script>

        function atualizarFeed() {
            fetch("/questionarios/listar")
            .then(function (resposta) {
                if (resposta.status == 204) {
                    document.getElementById("feed_container").innerHTML = "";
                    document.getElementById("feed_vazio").style.display = "block";
                }
                else if (resposta.ok){ 
                    document.getElementById("feed_vazio").style.display = "none"; // esconde a frase de "nada publicado ainda" já que agora tem algo

                    resposta.json().then(function (lista_memorias) {
                        const feed = document.getElementById("feed_container");
                        const id_usuario_logado = sessionStorage.ID_USUARIO;

                        feed.innerHTML = "";

                        for(let i = 0; i < lista_memorias.length; i ++){
                            const memoria = lista_memorias[i];

                            let recomendacao_texto = "Nenhuma";
                            if(memoria.recomendacao != null && memoria.recomendacao != ""){
                                recomendacao_texto = memoria.recomendacao;
                            }

                            // cria os botões que ficam nos comentários
                            let botoes_html = "";
                            if(memoria.fkUsuario == id_usuario_logado){
                                botoes_html = `
                                <div class = "div-buttons">
                                    <button class = "publicacao-btn-editar" onclick = "editar(${memoria.idQuestionario})">Editar</button>
                                    <button class = "publicacao-btn-editar" onclick = "deletar(${memoria.idQuestionario})">Deletar</button>
                                    </div>
                                    `;
                            }

                            //cria as caixas dos comentários
                            feed.innerHTML += `<div class = "publicacao">
                                <span class = "publicacao-nome-autor">Autor: <b>${memoria.nomeUsuario}</b></span>
                                <span class = "publicacao-jogo">Jogo: <b>${memoria.jogo}</b></span>
                                <div class = "publicacao-descricao">${memoria.motivacao}</div>
                                <div class = "publicacao-recomendacao">Recomenda: <b>${recomendacao_texto}</b></div>
                                ${botoes_html}
                                </div>
                                `;   
                        }
                    })
                }
                else{
                    alert("Erro ao carregar o mural!" + resposta.status);
                }
            })
            .catch(function(erro) {
                console.error(erro);
                alert("Erro de conexão ao buscar o mural");
            })
        }

        // função deletar comentário
        function deletar(id_questionario) {
            aguardar();

            fetch(`/questionarios/deletar/${id_questionario}`, {
                method: "DELETE",
            })
            .then(function (resposta) {
                if(resposta.ok) {
                    alert("Memória apagada com sucesso!")
                    atualizarFeed();
                }
                else {
                    alert("Erro ao apagar a memória!" + resposta.status);
                }
                finalizarAguardar();
            })
            .catch(function (erro) {
                console.error(erro);
                alert("Erro de conexão com o servidor");
                finalizarAguardar();
            });
        }
        
        // função editar comentário
        function editar(id_questionario){
            sessionStorage.ID_QUESTIONARIO_EDITANDO = id_questionario;
            window.location = "./edicao-questionario.html";
        }

    </script>
</body>

</html>
