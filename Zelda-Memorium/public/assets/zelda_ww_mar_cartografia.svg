<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <defs>
        <!-- Fundo Oceano Escuro -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#041220"/>
            <stop offset="100%" stop-color="#0c233c"/>
        </linearGradient>
        <!-- Gradiente Ouro Náutico -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d49e35"/>
            <stop offset="50%" stop-color="#f3d078"/>
            <stop offset="100%" stop-color="#b88224"/>
        </linearGradient>
        <!-- Gradiente Espuma do Mar / Cel-Shaded -->
        <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#aae5f0"/>
            <stop offset="100%" stop-color="#4ba3c3"/>
        </linearGradient>
    </defs>

    <!-- Fundo Principal -->
    <rect x="15" y="15" width="770" height="470" rx="15" fill="url(#bgGrad)" stroke="#112d4e" stroke-width="3"/>

    <!-- Grade Náutica / Linhas de Mapa Sutil -->
    <g stroke="#0e2a47" stroke-width="1" stroke-dasharray="8,8" opacity="0.6">
        <line x1="100" y1="15" x2="100" y2="485" />
        <line x1="400" y1="15" x2="400" y2="485" />
        <line x1="700" y1="15" x2="700" y2="485" />
        <line x1="15" y1="120" x2="785" y2="120" />
        <line x1="15" y1="250" x2="785" y2="250" />
        <line x1="15" y1="380" x2="785" y2="380" />
    </g>

    <!-- Moldura Ouro Estilo Linha Marítima -->
    <rect x="35" y="35" width="730" height="430" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <rect x="42" y="42" width="716" height="416" rx="6" fill="none" stroke="#e0be67" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- Elemento Central do Topo: Rosa dos Ventos Simplificada / Estrela Guia -->
    <g transform="translate(400, 35)">
        <polygon points="0,-20 5,0 -5,0" fill="#d49e35"/>
        <polygon points="0,20 5,0 -5,0" fill="#b88224"/>
        <polygon points="-20,0 0,5 0,-5" fill="#f3d078"/>
        <polygon points="20,0 0,5 0,-5" fill="#d49e35"/>
        <circle cx="0" cy="0" r="4" fill="#041220"/>
    </g>

    <!-- Cantos Inferiores: Ondas Espirais Cel-Shaded de Wind Waker -->
    <!-- Canto Esquerdo Inferior -->
    <g transform="translate(35, 465)">
        <path d="M 0,0 C 20,-5 35,-25 30,-45 C 25,-60 5,-60 -5,-45 C -12,-35 -5,-20 5,-25 C 10,-28 8,-35 2,-35" fill="none" stroke="url(#foamGrad)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="2" cy="-35" r="2.5" fill="#aae5f0"/>
    </g>
    <!-- Canto Direito Inferior -->
    <g transform="translate(765, 465) scale(-1, 1)">
        <path d="M 0,0 C 20,-5 35,-25 30,-45 C 25,-60 5,-60 -5,-45 C -12,-35 -5,-20 5,-25 C 10,-28 8,-35 2,-35" fill="none" stroke="url(#foamGrad)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="2" cy="-35" r="2.5" fill="#aae5f0"/>
    </g>

    <!-- Cantos Superiores: Decorações de Cantoneira Náutica de Caixa de Diálogo -->
    <!-- Superior Esquerdo -->
    <g transform="translate(35, 35)">
        <path d="M 0,25 L 0,0 L 25,0" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="square"/>
        <circle cx="15" cy="15" r="3" fill="#041220" stroke="#f3d078" stroke-width="1.5"/>
    </g>
    <!-- Superior Direito -->
    <g transform="translate(765, 35) scale(-1, 1)">
        <path d="M 0,25 L 0,0 L 25,0" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="square"/>
        <circle cx="15" cy="15" r="3" fill="#041220" stroke="#f3d078" stroke-width="1.5"/>
    </g>
</svg>