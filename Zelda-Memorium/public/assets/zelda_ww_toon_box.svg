<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Parchment Texture Background -->
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1813" />
      <stop offset="100%" stop-color="#2d2219" />
    </linearGradient>
    
    <!-- Toon Red Accent (Reminiscent of the King of Red Lions boat / Outset Island icons) -->
    <linearGradient id="toonRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6523a" />
      <stop offset="100%" stop-color="#ba2b16" />
    </linearGradient>

    <!-- Sun Bright Yellow/Orange -->
    <linearGradient id="sunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd860" />
      <stop offset="100%" stop-color="#f29a22" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="15" y="15" width="770" height="470" rx="20" fill="url(#parchmentGrad)" stroke="url(#toonRed)" stroke-width="5" />
  
  <!-- Inner Frame with Toon Style Blocks -->
  <rect x="32" y="32" width="736" height="436" rx="12" fill="none" stroke="url(#sunGold)" stroke-width="2" />
  
  <!-- Cel-Shaded Corner Accents (Triangles & Dots typical of WW UI) -->
  <!-- Top Left -->
  <polygon points="32,32 62,32 32,62" fill="url(#sunGold)" />
  <circle cx="75" cy="45" r="4" fill="url(#toonRed)" />
  <circle cx="45" cy="75" r="4" fill="url(#toonRed)" />

  <!-- Top Right -->
  <polygon points="768,32 738,32 768,62" fill="url(#sunGold)" />
  <circle cx="725" cy="45" r="4" fill="url(#toonRed)" />
  <circle cx="755" cy="75" r="4" fill="url(#toonRed)" />

  <!-- Bottom Left -->
  <polygon points="32,468 62,468 32,438" fill="url(#sunGold)" />
  <circle cx="75" cy="455" r="4" fill="url(#toonRed)" />
  <circle cx="45" cy="425" r="4" fill="url(#toonRed)" />

  <!-- Bottom Right -->
  <polygon points="768,468 738,468 768,438" fill="url(#sunGold)" />
  <circle cx="725" cy="455" r="4" fill="url(#toonRed)" />
  <circle cx="755" cy="425" r="4" fill="url(#toonRed)" />

  <!-- The Legend of Zelda Wind Motif (Bottom Center Crest) -->
  <g transform="translate(400, 445) scale(0.8)">
    <path d="M -50,-10 C -20,-25 20,-25 50,-10 C 30,0 10,-5 0,-15 C -10,-5 -30,0 -50,-10 Z" fill="url(#sunGold)"/>
    <circle cx="0" cy="-25" r="5" fill="url(#toonRed)" />
  </g>
</svg>
