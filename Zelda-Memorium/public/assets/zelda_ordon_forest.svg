<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Forest/Woodland Green -->
    <linearGradient id="forestBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1a10"/>
      <stop offset="100%" stop-color="#142618"/>
    </linearGradient>
    
    <!-- Beige Accent Gradient -->
    <linearGradient id="beigeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6d5b8"/>
      <stop offset="100%" stop-color="#c5b291"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Green Container -->
  <rect x="15" y="15" width="770" height="470" rx="20" fill="url(#forestBg)" stroke="#1b3321" stroke-width="3"/>

  <!-- Inner Beige Leaf/Ordon Tribal Frame -->
  <rect x="30" y="30" width="740" height="440" rx="12" fill="none" stroke="url(#beigeGrad)" stroke-width="1.5" opacity="0.4"/>
  <rect x="36" y="36" width="728" height="428" rx="9" fill="none" stroke="url(#beigeGrad)" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>

  <!-- Ordon Spiral Wood/Leaf Ornaments in Corners -->
  <!-- Top Left Corner Ornament -->
  <g transform="translate(45, 45)" stroke="url(#beigeGrad)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 0 30 C 0 10, 10 0, 30 0" />
    <path d="M 5 20 C 5 12, 12 5, 20 5" />
    <circle cx="0" cy="0" r="3" fill="url(#beigeGrad)"/>
    <!-- Tribal leaf-like shape -->
    <path d="M 12 12 Q 25 25 15 35 Q 5 25 12 12 Z" fill="url(#beigeGrad)" fill-opacity="0.2"/>
  </g>

  <!-- Top Right Corner Ornament -->
  <g transform="translate(755, 45) scale(-1, 1)" stroke="url(#beigeGrad)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 0 30 C 0 10, 10 0, 30 0" />
    <path d="M 5 20 C 5 12, 12 5, 20 5" />
    <circle cx="0" cy="0" r="3" fill="url(#beigeGrad)"/>
    <path d="M 12 12 Q 25 25 15 35 Q 5 25 12 12 Z" fill="url(#beigeGrad)" fill-opacity="0.2"/>
  </g>

  <!-- Bottom Left Corner Ornament -->
  <g transform="translate(45, 455) scale(1, -1)" stroke="url(#beigeGrad)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 0 30 C 0 10, 10 0, 30 0" />
    <path d="M 5 20 C 5 12, 12 5, 20 5" />
    <circle cx="0" cy="0" r="3" fill="url(#beigeGrad)"/>
    <path d="M 12 12 Q 25 25 15 35 Q 5 25 12 12 Z" fill="url(#beigeGrad)" fill-opacity="0.2"/>
  </g>

  <!-- Bottom Right Corner Ornament -->
  <g transform="translate(755, 455) scale(-1, -1)" stroke="url(#beigeGrad)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 0 30 C 0 10, 10 0, 30 0" />
    <path d="M 5 20 C 5 12, 12 5, 20 5" />
    <circle cx="0" cy="0" r="3" fill="url(#beigeGrad)"/>
    <path d="M 12 12 Q 25 25 15 35 Q 5 25 12 12 Z" fill="url(#beigeGrad)" fill-opacity="0.2"/>
  </g>

  <!-- Top Center Accent: Ordon Shield/Sun motif fragment -->
  <g transform="translate(400, 28)" fill="url(#beigeGrad)">
    <path d="M -20 0 L 0 -8 L 20 0 L 0 12 Z" />
    <circle cx="-35" cy="2" r="2" opacity="0.6"/>
    <circle cx="35" cy="2" r="2" opacity="0.6"/>
  </g>

  <!-- Bottom Center Accent -->
  <g transform="translate(400, 472) scale(1, -1)" fill="url(#beigeGrad)">
    <path d="M -20 0 L 0 -8 L 20 0 L 0 12 Z" />
  </g>
</svg>
