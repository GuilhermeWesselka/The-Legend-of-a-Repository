<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="30%" stop-color="#fff3a8" />
      <stop offset="50%" stop-color="#aa7c11" />
      <stop offset="70%" stop-color="#fff3a8" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Central Hexagon / Octagon structure with teeth -->
    <polygon points="400,25 425,35 425,65 400,75 375,65 375,35" stroke-width="4"/>
    <polygon points="400,32 418,40 418,60 400,68 382,60 382,40" stroke-width="2"/>
    
    <!-- Central decorative teeth/combs -->
    <path d="M 390,25 L 390,17 M 400,25 L 400,15 M 410,25 L 410,17" />
    <path d="M 390,75 L 390,83 M 400,75 L 400,85 M 410,75 L 410,83" />

    <!-- Left Side Geometric Extensions -->
    <!-- Chevron connection -->
    <path d="M 375,40 L 355,50 L 375,60" />
    <path d="M 365,42 L 348,50 L 365,58" />
    
    <!-- Interlocking Square Box 1 -->
    <rect x="315" y="35" width="30" height="30" stroke-width="3" />
    <rect x="323" y="43" width="14" height="14" stroke-width="2" />
    <path d="M 315,50 L 300,50" />
    
    <!-- Interlocking Open Square Box 2 -->
    <path d="M 290,35 L 270,35 L 270,65 L 290,65" />
    <rect x="276" y="43" width="14" height="14" stroke-width="2" fill="url(#gold-grad)" fill-opacity="0.2" />
    <path d="M 270,50 L 245,50" />
    
    <!-- Outer accent boxes and horizontal lines -->
    <path d="M 245,42 L 230,42 L 230,58 L 245,58 Z" />
    <path d="M 230,50 L 160,50" stroke-width="4" />
    <path d="M 215,45 L 175,45" stroke-width="2" />
    <path d="M 215,55 L 175,55" stroke-width="2" />
    <path d="M 160,50 L 80,50" stroke-width="2" />

    <!-- Right Side Geometric Extensions (Symmetrical) -->
    <!-- Chevron connection -->
    <path d="M 425,40 L 445,50 L 425,60" />
    <path d="M 435,42 L 452,50 L 435,58" />
    
    <!-- Interlocking Square Box 1 -->
    <rect x="455" y="35" width="30" height="30" stroke-width="3" />
    <rect x="463" y="43" width="14" height="14" stroke-width="2" />
    <path d="M 485,50 L 500,50" />
    
    <!-- Interlocking Open Square Box 2 -->
    <path d="M 510,35 L 530,35 L 530,65 L 510,65" />
    <rect x="510" y="43" width="14" height="14" stroke-width="2" fill="url(#gold-grad)" fill-opacity="0.2" />
    <path d="M 530,50 L 555,50" />
    
    <!-- Outer accent boxes and horizontal lines -->
    <path d="M 555,42 L 570,42 L 570,58 L 555,58 Z" />
    <path d="M 570,50 L 640,50" stroke-width="4" />
    <path d="M 585,45 L 625,45" stroke-width="2" />
    <path d="M 585,55 L 625,55" stroke-width="2" />
    <path d="M 640,50 L 720,50" stroke-width="2" />
  </g>
</svg>
