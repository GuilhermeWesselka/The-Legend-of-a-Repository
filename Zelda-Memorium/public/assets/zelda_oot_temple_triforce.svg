<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGradOOT1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0b10" />
            <stop offset="100%" stop-color="#141824" />
        </linearGradient>
        <linearGradient id="goldGradOOT" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b8860b" />
            <stop offset="50%" stop-color="#ffd700" />
            <stop offset="100%" stop-color="#b8860b" />
        </linearGradient>
        <linearGradient id="blueGlowOOT" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4169e1" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#00ffff" stop-opacity="0.05"/>
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="780" height="480" x="10" y="10" rx="15" ry="15" fill="url(#bgGradOOT1)" stroke="#1a2233" stroke-width="2"/>
    
    <!-- Sacred Glow Background Effect -->
    <circle cx="400" cy="250" r="180" fill="url(#blueGlowOOT)" filter="blur(20px)" />

    <!-- Transparent Background Triforce -->
    <g transform="translate(400, 250) scale(1.2)" opacity="0.06">
        <!-- Top Triangle -->
        <polygon points="0,-90 -52,0 52,0" fill="#ffd700" />
        <!-- Left Triangle -->
        <polygon points="-52,0 -104,90 0,90" fill="#ffd700" />
        <!-- Right Triangle -->
        <polygon points="52,0 0,90 104,90" fill="#ffd700" />
    </g>

    <!-- Outer Fine Borders -->
    <rect width="750" height="450" x="25" y="25" rx="10" ry="10" fill="none" stroke="url(#goldGradOOT)" stroke-width="1.5" opacity="0.6"/>
    <rect width="742" height="442" x="29" y="29" rx="8" ry="8" fill="none" stroke="#ffd700" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

    <!-- Corner Ornaments (Classic OOT Temple Stone Frame style) -->
    <!-- Top-Left -->
    <g transform="translate(25, 25)">
        <path d="M 0,40 L 0,0 L 40,0 L 30,10 L 10,10 L 10,30 Z" fill="url(#goldGradOOT)" />
        <polygon points="15,15 25,15 15,25" fill="#ffd700" />
    </g>
    <!-- Top-Right -->
    <g transform="translate(775, 25) scale(-1, 1)">
        <path d="M 0,40 L 0,0 L 40,0 L 30,10 L 10,10 L 10,30 Z" fill="url(#goldGradOOT)" />
        <polygon points="15,15 25,15 15,25" fill="#ffd700" />
    </g>
    <!-- Bottom-Left -->
    <g transform="translate(25, 475) scale(1, -1)">
        <path d="M 0,40 L 0,0 L 40,0 L 30,10 L 10,10 L 10,30 Z" fill="url(#goldGradOOT)" />
        <polygon points="15,15 25,15 15,25" fill="#ffd700" />
    </g>
    <!-- Bottom-Right -->
    <g transform="translate(775, 475) scale(-1, -1)">
        <path d="M 0,40 L 0,0 L 40,0 L 30,10 L 10,10 L 10,30 Z" fill="url(#goldGradOOT)" />
        <polygon points="15,15 25,15 15,25" fill="#ffd700" />
    </g>

    <!-- Small Triforce Header Accent -->
    <g transform="translate(400, 20) scale(0.15)">
        <polygon points="0,-40 -23,0 23,0" fill="#ffd700" />
        <polygon points="-23,0 -46,40 0,40" fill="#ffd700" />
        <polygon points="23,0 0,40 46,40" fill="#ffd700" />
    </g>
</svg>